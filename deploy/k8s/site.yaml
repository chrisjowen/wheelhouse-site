# wheelhouse.chrisjowen.net on the k3s cluster: nginx serving the static site, behind Traefik with a
# Let's Encrypt certificate from cert-manager. deploy/scripts/deploy.sh applies this through the
# node's wheelhouse-site-deploy gate, which sets the image tag.
# Two replicas, a rolling update that never drops below two ready pods, and a PodDisruptionBudget,
# so neither a deploy nor a node drain takes the site down.
apiVersion: v1
kind: Namespace
metadata:
  name: wheelhouse-site
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: wheelhouse-site
  labels:
    app: wheelhouse-site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wheelhouse-site
  template:
    metadata:
      labels:
        app: wheelhouse-site
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Spread the pods over nodes when there is more than one; on one node both still run.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: wheelhouse-site
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Imported straight into k3s's containerd by the deploy gate; never pulled from a registry.
          image: wheelhouse-site:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          # Let Traefik drop the pod from its endpoints before nginx stops taking connections.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: wheelhouse-site
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wheelhouse-site
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: wheelhouse-site
spec:
  selector:
    app: wheelhouse-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: wheelhouse-site
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# The site has moved to Fleetyard: every request is sent there with a 301, the tour to its tour
# and everything else to its homepage. Traefik tries these in the ingress's order; the first whose
# regex matches redirects. The pods keep serving the site behind them (CI smoke-tests the image).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-fleetyard-tour
  namespace: wheelhouse-site
spec:
  redirectRegex:
    regex: ^https?://[^/]+/tour(?:[/?#].*)?$
    replacement: https://fleetyard.io/tour
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-fleetyard
  namespace: wheelhouse-site
spec:
  redirectRegex:
    regex: ^https?://[^/]+(?:/.*)?$
    replacement: https://fleetyard.io/
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: wheelhouse-site
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: wheelhouse-site-to-fleetyard-tour@kubernetescrd,wheelhouse-site-to-fleetyard@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wheelhouse.chrisjowen.net
      secretName: wheelhouse-chrisjowen-net-tls
  rules:
    - host: wheelhouse.chrisjowen.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
